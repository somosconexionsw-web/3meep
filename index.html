const{data:si}=await sb.from("section_items").select("*").eq("section",S.aS).order("position").order("id");
const pv=(k,x)=>x?`<img class="c a" src="${x}" alt="">`:"",fi=(id,t)=>`<input id="${id}" data-t="${t}" type="file" accept="image/*">`;
return`<div class="row"><button class="g s" data-a="back">‹ Niveles</button><span class="chip">Administrador</span></div>${err()}<h2>Casillas</h2><div class="row">${[1,2,3].map(n=>`<button class="${S.aL==n?"":"g"} s" data-a="aL" data-v="${n}">Nivel ${n}</button>`).join("")}</div><div class="t">${Array.from({length:40},(_,i)=>`<b class="${ks.some(k=>k.n==i+1)?"f":""} ${S.sel==i+1?"o":""}" data-a="sel" data-v="${i+1}" role="button" tabindex="0">${i+1}</b>`).join("")}</div>
<div class="card">${pv(0,img)}<label>Imagen de la casilla ${S.sel}${fi("f1","cell")}</label><label>Texto (premio o castigo)<textarea id="txt" rows="3">${esc(cur&&cur.txt||"")}</textarea></label><button data-a="savecell">Guardar casilla</button><button class="g" data-a="delcell">Vaciar casilla</button></div>
<div class="card"><h3>Portada (pantalla 1)</h3>${pv(0,S.t.c1)}<label>Imagen${fi("f2","c1")}</label><button data-a="savesite" data-v="cover1">Guardar portada</button></div>
<div class="card"><h3>Imagen de niveles (pantalla 2)</h3>${pv(0,S.t.c2)}<label>Imagen${fi("f3","c2")}</label><button data-a="savesite" data-v="cover2">Guardar imagen</button></div>
<div class="card"><h3>Activar suscripción</h3><label>Jugador<select id="su">${(pf||[]).map(p=>`<option value="${p.id}">${esc(p.username)}${p.phone?" · "+esc(p.phone):""}</option>`).join("")}</select></label><label>Plan<select id="sp"><option value="1">Mensual (1 mes)</option><option value="3">Trimestral (3 meses)</option><option value="6">Semestral (6 meses)</option></select></label><button data-a="subon">Activar suscripción</button>${(ss||[]).filter(x=>x.status=="active"&&new Date(x.ends_at)>new Date()).map(x=>`<div class="row"><span>${esc(nm(x.user_id))} · ${esc(x.plan)} · hasta ${fd(x.ends_at)}</span><button class="g s" data-a="suboff" data-v="${x.user_id}">Quitar</button></div>`).join("")}</div>
<div class="card"><h3>Códigos de acceso temporales</h3><label>Para quién (nota)<input id="cn"></label><label>Duración en horas<input id="ch" type="number" value="24" min="1" max="720"></label><button data-a="codenew">Generar código</button><div id="cnew"></div>${(cl||[]).map(c=>`<div class="row"><span>${esc(c.note||"sin nota")} · ${c.used_at?"usado por "+esc(c.used_by_name||"?")+" el "+fd(c.used_at):"sin usar"}</span>${c.used_at?"":`<button class="g s" data-a="codedel" data-v="${c.id}">Anular</button>`}</div>`).join("")}</div>
<div class="card"><h3>Texto de pago</h3><label>Instrucciones que ven los jugadores<textarea id="ptxt" rows="8">${esc(rp)}</textarea></label><button data-a="savepay">Guardar texto de pago</button></div>
<div class="card"><h3>Pantalla de reglas</h3>${pv(0,S.t.c3)}<label>Imagen de fondo${fi("f5","c3")}</label><button data-a="savesite" data-v="rules">Guardar imagen</button><label>Texto de las reglas<textarea id="rtxt" rows="12">${esc(rt)}</textarea></label><button data-a="saverules">Guardar reglas</button></div>
<div class="card"><h3>Secciones</h3><div class="lv">${SECS.map(n=>`<button class="${S.aS==n?"":"g"}" data-a="aS" data-v="${n}">${n}</button>`).join("")}</div>${(si||[]).map(i=>`<div class="row"><span>${esc(i.title)} · ${esc(i.extra)}</span><button class="g s" data-a="secdel" data-v="${i.id}">Quitar</button></div>`).join("")}<label>Título<input id="st"></label><label>Descripción<textarea id="sd" rows="2"></textarea></label><label>${S.aS=="Tienda"?"Precio":S.aS=="Eventos"?"Fecha":"Etiqueta"}<input id="sx"></label>${pv(0,S.t.sec)}<label>Imagen (opcional)${fi("f4","sec")}</label><button data-a="secadd">Agregar a ${S.aS}</button></div>`}
};
async function draw(){if(S.view=="admin"&&!isAdm())S.view="levels";$("#app").innerHTML=await V[S.view]();window.scrollTo(0,0);}
const keep=async f=>{const v={};document.querySelectorAll("#app textarea,#app input:not([type=file])").forEach(x=>{if(x.id)v[x.id]=x.value});await f();await draw();for(const k in v){const x=document.getElementById(k);if(x)x.value=v[k]}};
const sheet=h=>{const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sh" role="dialog" aria-modal="true">${h}<button class="g" data-a="close">Cerrar</button></div>`;document.body.appendChild(o)};
const closeS=()=>document.querySelectorAll(".ov").forEach(o=>o.remove());
const paywall=async t=>{const p=(await txt("pay"))||DEF_PAY;sheet(`<h2>Suscríbete para seguir</h2><p>${esc(t)}</p>${fmt(p)}<label>¿Tienes un código de acceso?<input id="cd" autocomplete="off" placeholder="XXXX-XXXX-XXXX"></label><button data-a="redeem">Canjear código</button><p class="err" id="msg"></p>`)};
const run=f=>async v=>{try{await f(v)}catch(e){msg("Error: "+(e.message||e))}};
const redir=()=>location.href.split("#")[0].split("?")[0];

const A={
tab(v){S.tab=v;S.msg="";draw()},
redeem:run(async()=>{const c=$("#cd").value.trim();if(!c)return msg("Escribe tu código.");const{data,error}=await sb.rpc("redeem_code",{p_code:c});if(error)throw error;if(!data.ok)return msg(data.msg);const{data:{user}}=await sb.auth.getUser();await boot(user);closeS();sheet(`<h2>Acceso activado</h2><p>Tienes acceso a todos los niveles hasta ${esc(new Date(data.ends_at).toLocaleString("es-PE",{dateStyle:"medium",timeStyle:"short"}))}.</p>`);S.view="levels";draw()}),
subon:run(async()=>{const id=$("#su").value,m=+$("#sp").value,plan={1:"mensual",3:"trimestral",6:"semestral"}[m],{data:cur}=await sb.from("subscriptions").select("ends_at,status").eq("user_id",id).maybeSingle();let b=new Date();if(cur&&cur.status=="active"&&new Date(cur.ends_at)>b)b=new Date(cur.ends_at);b.setMonth(b.getMonth()+m);const{error}=await sb.from("subscriptions").upsert({user_id:id,plan,status:"active",ends_at:b.toISOString()});if(error)throw error;await draw();msg("Suscripción activada.")}),
suboff:run(async v=>{const{error}=await sb.from("subscriptions").update({status:"inactive"}).eq("user_id",v);if(error)throw error;draw()}),
codenew:run(async()=>{const{data,error}=await sb.rpc("admin_create_code",{p_note:$("#cn").value.trim(),p_hours:+$("#ch").value||24,p_valid_days:30});if(error)throw error;await draw();const e=$("#cnew");e.innerHTML=`<p class="tx">${esc(data)}</p><p class="m">Cópialo ahora y envíaselo a la persona. Por seguridad no se vuelve a mostrar.</p>`;e.scrollIntoView({block:"center"})}),
codedel:run(async v=>{const{error}=await sb.rpc("admin_delete_code",{p_id:+v});if(error)throw error;draw()}),
savepay:run(async()=>{const b=$("#ptxt").value.trim();if(b){const{error}=await sb.from("site_texts").upsert({key:"pay",body:b});if(error)throw error}else{await sb.from("site_texts").delete().eq("key","pay")}await draw();msg("Texto de pago guardado.")}),
cont(){try{sessionStorage.setItem("rs","1")}catch(e){}S.view="levels";draw()},
saverules:run(async()=>{const b=$("#rtxt").value.trim();if(b){const{error}=await sb.from("site_texts").upsert({key:"rules",body:b});if(error)throw error}else{await sb.from("site_texts").delete().eq("key","rules")}await draw();msg("Reglas guardadas.")}),
eye(v,b){const i=b.parentNode.querySelector("input"),on=i.type=="password";i.type=on?"text":"password";b.textContent=on?"👁️":"🙈";b.setAttribute("aria-pressed",on);b.setAttribute("aria-label",on?"Ocultar contraseña":"Mostrar contraseña")},
reg:run(async()=>{const u=$("#u").value.trim(),e=$("#e").value.trim(),p=$("#p").value;
 if(!u||!/^\S+@\S+\.\S+$/.test(e)||p.length<8)return msg("Completa usuario, correo y una contraseña de 8 caracteres o más.");
 if(!$("#age").checked)return msg("Debes confirmar que eres mayor de 18 años.");
 const{error}=await sb.auth.signUp({email:e,password:p,options:{data:{username:u,phone:$("#ph").value.trim()},emailRedirectTo:redir()}});
 if(error)return msg("No se pudo crear la cuenta: "+(/database/i.test(error.message)?"ese usuario ya existe.":error.message));
 if(S.t.av){try{localStorage.setItem("pa-"+e.toLowerCase(),S.t.av)}catch(x){}}
 S.tab="in";S.msg="Cuenta creada. Revisa tu correo, confirma tu cuenta y luego entra.";draw()}),
log:run(async()=>{const{error}=await sb.auth.signInWithPassword({email:$("#e").value.trim(),password:$("#p").value});if(error)msg(/confirm/i.test(error.message)?"Confirma tu correo antes de entrar.":"Correo o contraseña incorrectos.")}),
forgot:run(async()=>{const e=$("#e").value.trim();if(!e)return msg("Escribe tu correo arriba.");const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:redir()});msg(error?error.message:"Si el correo existe, te enviamos un enlace para crear una contraseña nueva.")}),
setpw:run(async()=>{const p=$("#p").value;if(p.length<8)return msg("Mínimo 8 caracteres.");const{error}=await sb.auth.updateUser({password:p});if(error)return msg(error.message);S.view="levels";draw()}),
out(){try{sessionStorage.removeItem("rs")}catch(e){}sb.auth.signOut()},
play(v){v=+v;if(v>1&&!S.prem)return paywall("Los niveles 2 y 3 son para suscriptores.");S.lvl=v;S.roll=null;S.view="game";draw()},
back(){S.view="levels";draw()},
exp(v){S.sec=v;S.view="sec";draw()},
pay(){paywall("Elige un plan para desbloquear todo.")},
sub(){closeS();sheet(`<h2>Pago</h2><p>Aquí se conectará el pago real. Por ahora tu cuenta no cambia.</p>`)},
close:closeS,
reset(){S.prog[S.lvl]=0;S.roll=null;saveP();draw()},
async roll(){const b=$("#roll"),d=$("#dice");b.disabled=true;d.classList.add("r");const iv=setInterval(()=>{d.src="d"+(1+Math.floor(Math.random()*6))+".png"},110);await new Promise(r=>setTimeout(r,5000));clearInterval(iv);const n=[1,1,2,2,2,3,3,3,4,4,4,5,5,6][Math.floor(Math.random()*14)];S.roll={d:n,to:Math.min(40,S.prog[S.lvl]+n)};draw()},
async ir(){const to=S.roll&&S.roll.to;if(!to)return;if(locked(S.lvl,to))return paywall("Terminaste las casillas gratuitas. Suscríbete para seguir hasta la 40.");S.prog[S.lvl]=to;saveP();S.cv={n:to,c:await cell(S.lvl,to)};S.roll={d:S.roll.d,to:null};S.view="card";draw()},
ret(){S.view="game";S.cv=null;draw()},
admin(){S.view="admin";S.t={};S.msg="";draw()},
aL(v){S.aL=+v;S.sel=1;S.t={};draw()},
sel(v){S.sel=+v;S.t.cell=null;draw()},
aS(v){S.aS=v;S.t.sec=null;keep(async()=>{})},
savecell:run(async()=>{const o=await cell(S.aL,S.sel);let ip=o&&o.img_path||"";if(S.t.cell)ip=await up("content","c/"+crypto.randomUUID()+".jpg",S.t.cell);const{error}=await sb.from("cells").upsert({level:S.aL,n:S.sel,img_path:ip,txt:$("#txt").value.trim()});if(error)throw error;S.t.cell=null;await draw();msg("Casilla guardada.")}),
delcell:run(async()=>{const{error}=await sb.from("cells").delete().eq("level",S.aL).eq("n",S.sel);if(error)throw error;S.t.cell=null;draw()}),
savesite:run(async k=>{const t=k=="cover1"?"c1":k=="cover2"?"c2":"c3";if(!S.t[t])return msg("Primero elige una imagen.");const p=await up("content","c/"+crypto.randomUUID()+".jpg",S.t[t]),{error}=await sb.from("site_images").upsert({key:k,img_path:p});if(error)throw error;S.t[t]=null;await draw();msg("Imagen guardada.")}),
secadd:run(async()=>{const t=$("#st").value.trim();if(!t)return $("#st").focus();let p="";if(S.t.sec)p=await up("content","c/"+crypto.randomUUID()+".jpg",S.t.sec);const{error}=await sb.from("section_items").insert({section:S.aS,title:t,descr:$("#sd").value.trim(),extra:$("#sx").value.trim(),img_path:p});if(error)throw error;S.t.sec=null;draw()}),
secdel:run(async v=>{const{error}=await sb.from("section_items").delete().eq("id",v);if(error)throw error;draw()})
};
document.addEventListener("click",e=>{const a=e.target.closest("[data-a]");if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset.v,a)});
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".cv,img.c"))e.preventDefault()});
document.addEventListener("dragstart",e=>{if(e.target.tagName=="IMG")e.preventDefault()});
document.addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.matches("b[data-a],.cv")){e.preventDefault();e.target.click()}});
document.addEventListener("change",async e=>{const i=e.target;if(!i.files||!i.files[0])return;
 if(i.id=="pf"){try{S.t.av=await toJ(i.files[0],256);const p=$("#pv");p.src=S.t.av;p.hidden=false}catch(x){}return}
 if(i.dataset.t){const m=/^c[123]$/.test(i.dataset.t)?1280:640;try{await keep(async()=>{S.t[i.dataset.t]=await toJ(i.files[0],m)})}catch(x){}}});
sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(async()=>{
 if(ev=="PASSWORD_RECOVERY"){S.view="reset";return draw()}
 if(ses){const nw=!S.prof||S.prof.id!=ses.user.id;if(nw)await boot(ses.user);else if(!["boot","login"].includes(S.view))return;if(["boot","login"].includes(S.view)){let r=0;try{r=sessionStorage.getItem("rs")}catch(e){}S.view=r?"levels":"rules"}}
 else{S.prof=null;S.view="login"}
 draw()},0)});
["1","2","3","4","5","6"].forEach(n=>{new Image().src="d"+n+".png"});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
draw();
</script></body></html>
